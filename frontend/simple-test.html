<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Basic Test</title>
</head>
<body>
    <h1>Web3 Basic Test</h1>
    <button id="test-btn">Test Web3 Connection</button>
    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script>
        document.getElementById('test-btn').addEventListener('click', async function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing Web3 connection...</p>';
            
            try {
                console.log('Web3 version:', Web3.version);
                const web3 = new Web3('http://127.0.0.1:7545');
                const accounts = await web3.eth.getAccounts();
                resultDiv.innerHTML += `<p>Connected! Found ${accounts.length} accounts.</p>`;
                resultDiv.innerHTML += `<p>First account: ${accounts[0]}</p>`;
                
                const networkId = await web3.eth.net.getId();
                resultDiv.innerHTML += `<p>Network ID: ${networkId}</p>`;
                
                // Test contract connection
                const minABI = [
                    "function owner() view returns (address)",
                    "function entryFee() view returns (uint256)"
                ];
                
                const contractAddress = '0x691aB82f2098323384182971FfAf1e62626F687E';
                const contract = new web3.eth.Contract(minABI, contractAddress);
                
                try {
                    const owner = await contract.methods.owner().call();
                    resultDiv.innerHTML += `<p>Contract owner: ${owner}</p>`;
                } catch (error) {
                    resultDiv.innerHTML += `<p>Error calling contract: ${error.message}</p>`;
                }
                
            } catch (error) {
                resultDiv.innerHTML += `<p>Error: ${error.message}</p>`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
